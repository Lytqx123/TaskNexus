apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tasknexus-agent-backend-ingress
  namespace: tasknexus
  annotations:
    kubernetes.io/ingress.global-static-ip-name: tasknexus-agent-backend-ip
    networking.gke.io/managed-certificates: tasknexus-agent-backend-ssl
    nginx.ingress.kubernetes.io/websocket-services: gateway
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-connect-timeout: '3600'
spec:
  rules:
    - host: YOUR_DOMAIN
      http:
        paths:
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: tasknexus-agent-backend
                port:
                  number: 80